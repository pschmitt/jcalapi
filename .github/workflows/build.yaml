name: container-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to Docker Hub and GHCR
        type: boolean
        default: true
        required: false
  push:
    branches:
      - 'main'

jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
    uses: pschmitt/ci-workflows/.github/workflows/docker-build.yaml@main
    with:
      image-name: pschmitt/jcalapi
      platforms: linux/amd64,linux/arm64
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKER_USERNAME }}
      dockerhub_password: ${{ secrets.DOCKER_TOKEN }}
